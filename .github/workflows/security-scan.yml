name: Security Scan

on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        default: '.'
      runs_on:
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  secrets:
    name: secrets (gitleaks)
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ inputs.working_directory }}/.gitleaks.toml
          # No runner em container o workspace não fica sob $HOME; o upload do
          # artefato SARIF do action quebra com "rootDirectory is not a parent".
          # O scan continua; o artefato não é consumido por nenhum job.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  trivy:
    name: filesystem & deps (trivy)
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working_directory }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  semgrep:
    name: sast (semgrep)
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true
