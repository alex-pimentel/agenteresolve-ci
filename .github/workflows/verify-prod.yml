name: verify-prod

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Production verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run production checks
        run: bash scripts/verify-prod.sh --json
